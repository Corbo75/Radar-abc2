<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020a05">
<title>Radar ABC — Journal sécurisé</title>
<style>
:root{box-sizing:border-box}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020a05;color:#5dff9a;font-family:ui-monospace,Menlo,Consolas,monospace}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));user-select:none;-webkit-user-select:none}
#top{text-align:center;width:100%;min-height:66px}
#big{font-size:32px;font-weight:800;line-height:1.15}
#sub{font-size:15px;margin-top:4px}
#st{font-size:12px;opacity:.75;margin-top:4px;min-height:15px}
canvas{display:block;width:min(92vw,52vh);height:min(92vw,52vh);max-width:620px;max-height:620px;touch-action:none}
#pts{width:100%;max-width:620px;display:flex;flex-direction:column;gap:6px}
.pt{display:flex;gap:6px}
button{appearance:none;background:#04210f;color:#5dff9a;border:1px solid #1f8a4c;border-radius:10px;padding:11px 8px;font:inherit;font-size:14px;min-height:46px}
button:active{background:#0a4a24}
button:disabled{opacity:.45}
.lab{flex:1;text-align:left;border-width:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk,.cl{flex:0 0 54px}
.row{display:flex;gap:6px;width:100%;max-width:620px}
.row button{flex:1}
#gps{border-color:#36c76f}
#gps.off{border-color:#777;color:#aaa}
#gps.busy{border-color:#e0bd42;color:#e0bd42}

/* Volet Journal */
#journal-panel{position:fixed;inset:0;background:rgba(2,10,5,0.98);display:none;flex-direction:column;z-index:25;padding:15px;max-width:620px;margin:0 auto;border:1px solid #1f8a4c}
#journal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #1f8a4c;padding-bottom:10px}
#journal-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.log-item{background:#04210f;border:1px solid #0a4a24;border-radius:8px;padding:10px;font-size:13px;line-height:1.4}
.log-top{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:4px}
.log-coords{font-size:12px;color:#8a9a90}

#ov,#sleep{position:fixed;inset:0;background:#020a05;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:20;padding:24px;gap:16px}
#sleep{display:none;background:#000;color:#0f4}
#go{font-size:22px;padding:20px 34px}
.small{max-width:390px;font-size:14px;line-height:1.45;opacity:.86}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:90vw;padding:10px 14px;background:#071b0d;border:1px solid #1f8a4c;border-radius:10px;text-align:center;display:none;z-index:30}
</style>
</head>
<body>
<div id="top">
  <div id="big">&mdash;</div>
  <div id="sub">Active le GPS puis marque un point avec &#128205;</div>
  <div id="st"></div>
</div>

<canvas id="c" width="700" height="700" aria-label="Radar"></canvas>

<div id="pts"></div>

<div class="row">
  <button id="gps">&#128205; GPS : d&eacute;sactiv&eacute;</button>
  <button id="snd">&#128066; Sonar : on</button>
</div>
<div class="row">
  <button id="slp">&#127769; &Eacute;cran noir</button>
  <button id="clear">&#9851; R&eacute;initialiser actifs</button>
</div>
<div class="row">
  <button id="open-journal" style="border-color:#36c76f">&#128220; Journal des points</button>
</div>

<!-- Volet Coulissant Journal -->
<div id="journal-panel">
  <div id="journal-header">
    <span style="font-size:16px;font-weight:bold">&#128220; Historique des points</span>
    <button id="close-journal" style="min-height:auto;padding:6px 12px">&#10006; Fermer</button>
  </div>
  <div id="journal-list"></div>
  <div style="margin-top:12px;display:flex;gap:10px">
    <button id="clear-hist" style="flex:1;border-color:#ff6a5d;color:#ff6a5d">&#128465; Effacer tout le journal</button>
  </div>
</div>

<div id="toast"></div>

<div id="ov">
  <div style="font-size:26px">&#128262; Radar ABC</div>
  <div class="small">
    1. Appuie sur D&eacute;marrer.<br>
    2. Autorise la boussole si demand&eacute;.<br>
    3. Active le GPS pour avoir ta position.<br>
    4. Utilise &#128205; pour enregistrer A, B ou C.
  </div>
  <button id="go">&#9654; D&eacute;marrer</button>
</div>

<div id="sleep">
  <div id="sd" style="font-size:46px"></div>
  <div id="sm" style="font-size:20px"></div>
  <div style="opacity:.4;font-size:13px;margin-top:24px">Touche l'écran pour quitter</div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const cv = $('c');
const g = cv.getContext('2d');

const KEYS = ['A','B','C'];
const COL = {A:'#ffdc50',B:'#4de0ff',C:'#ff6ad5'};
const FQ = {A:1000,B:1250,C:1500};
const NICE = [25,50,100,250,500,1000,2500,5000,10000,25000,100000];

let P = {A:null,B:null,C:null};
let history = [];
let sel = 'A';
let me = null;
let gpsWatch = null;
let gpsEnabled = false;
let gpsBusy = false;
let buf = [];

let comp = null;
let compT = 0;
let gpsH = null;
let orientationStarted = false;

let soundOn = true;
let ac = null;
let started = false;
let swStart = performance.now();

// Chargement et validation des données en mémoire
try {
  const savedP = JSON.parse(localStorage.getItem('radarABC.points') || '{}');
  KEYS.forEach(k => { 
    if(savedP[k] && Number.isFinite(savedP[k].lat) && Number.isFinite(savedP[k].lon)) {
      P[k] = savedP[k];
    }
  });
  const savedH = JSON.parse(localStorage.getItem('radarABC.history') || '[]');
  if(Array.isArray(savedH)) history = savedH;
} catch(e) {}

function save(){
  try { 
    localStorage.setItem('radarABC.points', JSON.stringify(P)); 
    localStorage.setItem('radarABC.history', JSON.stringify(history)); 
  } catch(e) {}
}

const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const norm = a => ((a % 360) + 360) % 360;

function dist(a,b){
  const R=6371000;
  const dLa=rad(b.lat-a.lat), dLo=rad(b.lon-a.lon);
  const x=Math.sin(dLa/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(Math.min(1,x)));
}

function bearing(a,b){
  const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat)) - Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
  return norm(deg(Math.atan2(y,x)));
}

function fmt(m){
  return m < 1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km';
}

/* ---------- Boussole ---------- */
function tiltHeading(alpha,beta,gamma){
  if(alpha==null || beta==null || gamma==null) return null;
  const x=rad(beta), y=rad(gamma), z=rad(alpha);
  const cX=Math.cos(x),sX=Math.sin(x),cY=Math.cos(y),sY=Math.sin(y),cZ=Math.cos(z),sZ=Math.sin(z);
  const tx=-sZ*cX, ty=cZ*cX;
  const bx=-(cZ*sY+sZ*sX*cY), by=-(sZ*sY-cZ*sX*cY);
  const wt=Math.hypot(tx,ty)**3, wb=Math.hypot(bx,by)**3;
  if(wt+wb<1e-6) return null;
  return norm(deg(Math.atan2(tx*wt+bx*wb, ty*wt+by*wb)));
}

function setComp(h){
  if(!Number.isFinite(h)) return;
  if(comp==null) comp=norm(h);
  else {
    const d=((h-comp+540)%360)-180;
    comp=norm(comp+d*.25);
  }
  compT=performance.now();
}

function onAbs(e){
  const h=tiltHeading(e.alpha,e.beta,e.gamma);
  if(h!=null) setComp(h);
}

function onRel(e){
  if(Number.isFinite(e.webkitCompassHeading)) {
    setComp(e.webkitCompassHeading);
    return;
  }
  if(e.absolute && e.alpha!=null) {
    const h=tiltHeading(e.alpha,e.beta,e.gamma);
    if(h!=null) setComp(h);
  }
}

function curHeading(){
  if(comp!=null && performance.now()-compT < 4000) return {h:comp,src:'boussole'};
  if(gpsH!=null) return {h:gpsH,src:'cap GPS'};
  return {h:null,src:'aucun'};
}

async function startOrientation(){
  if(orientationStarted) return;
  try {
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }
    window.addEventListener('deviceorientationabsolute', onAbs, true);
    window.addEventListener('deviceorientation', onRel, true);
    orientationStarted = true;
  } catch(e) {}
}

/* ---------- GPS ---------- */
function setGpsButton(){
  const b=$('gps');
  b.classList.remove('off','busy');
  if(gpsBusy){
    b.classList.add('busy');
    b.innerHTML='&#128205; GPS : recherche\u2026';
  } else if(gpsEnabled){
    b.innerHTML='&#128205; GPS : activ\u00e9';
  } else {
    b.classList.add('off');
    b.innerHTML='&#128205; GPS : d\u00e9sactiv\u00e9';
  }
}

function resetPosition(){
  me=null;
  gpsH=null;
  buf=[];
}

function stopGPS(){
  if(gpsWatch !== null && navigator.geolocation){
    try { navigator.geolocation.clearWatch(gpsWatch); } catch(e) {}
  }
  gpsWatch=null;
  gpsEnabled=false;
  gpsBusy=false;
  resetPosition();
  setGpsButton();
  refresh();
}

function gpsFailure(){
  gpsBusy=false;
  gpsEnabled=false;
  gpsWatch=null;
  resetPosition();
  setGpsButton();
  refresh();
}

function startGPS(){
  if(!started || !navigator.geolocation || gpsWatch !== null || gpsBusy) return;

  gpsBusy=true;
  gpsEnabled=true;
  setGpsButton();
  refresh();

  try {
    gpsWatch = navigator.geolocation.watchPosition(onGPS, gpsFailure, {
      enableHighAccuracy:true,
      maximumAge:1000,
      timeout:15000
    });
  } catch(e) { gpsFailure(); }
}

function onGPS(p){
  const c=p.coords;
  if(!Number.isFinite(c.latitude) || !Number.isFinite(c.longitude)) return;

  const f={ lat:c.latitude, lon:c.longitude, acc:Number.isFinite(c.accuracy) ? c.accuracy : 30 };
  buf.push(f);
  if(buf.length>5) buf.shift();

  let sw=0,la=0,lo=0;
  for(const b of buf){
    const w=1/Math.max(b.acc,3)**2;
    sw+=w; la+=b.lat*w; lo+=b.lon*w;
  }

  const previous=me;
  me={lat:la/sw,lon:lo/sw,acc:f.acc};

  if(Number.isFinite(c.heading) && Number.isFinite(c.speed) && c.speed>0.8) {
    gpsH=norm(c.heading);
  } else if(previous && dist(previous,me)>5) {
    gpsH=bearing(previous,me);
  }

  gpsBusy=false;
  setGpsButton();
  refresh();
}

function toggleGPS(){
  if(!started) return;
  if(gpsEnabled) stopGPS();
  else startGPS();
}

/* ---------- Audio ---------- */
function audio(){
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
  }catch(e){}
}

function ping(vol,freq){
  if(!ac || !soundOn) return;
  try{
    const t=ac.currentTime;
    const o=ac.createOscillator(),v=ac.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(freq,t);
    v.gain.setValueAtTime(.0001,t);
    v.gain.linearRampToValueAtTime(vol,t+.01);
    v.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(v); v.connect(ac.destination);
    o.start(t); o.stop(t+0.6);
  }catch(e){}
}

/* ---------- Calculs ---------- */
function calc(){
  const H=curHeading();
  const hh=H.h==null ? 0 : H.h;
  const items=[];
  let mx=0;

  if(me){
    for(const k of KEYS){
      const p=P[k];
      if(!p) continue;
      const d=dist(me,p);
      const b=bearing(me,p);
      items.push({k,d,b,rel:norm(b-hh)});
      mx=Math.max(mx,d);
    }
  }

  const rng=NICE.find(n=>n>=Math.max(mx*1.1,1)) || NICE[NICE.length-1];
  return {items,H,hh,rng};
}

const CARD=['Nord','Nord-Est','Est','Sud-Est','Sud','Sud-Ouest','Ouest','Nord-Ouest'];
function words(it,hasH){
  if(!hasH) return 'vers le '+CARD[Math.round(it.b/45)%8];
  const W=['devant','devant \u00e0 droite','\u00e0 droite','derri\u00e8re \u00e0 droite','derri\u00e8re','derri\u00e8re \u00e0 gauche','\u00e0 gauche','devant \u00e0 gauche'];
  return W[Math.round(it.rel/45)%8];
}

/* ---------- Interface ---------- */
function buildRows(){
  $('pts').innerHTML=KEYS.map(k=>`
    <div class="pt">
      <button class="lab" data-k="${k}" style="border-color:${COL[k]};color:${COL[k]}"></button>
      <button class="mk" data-m="${k}" title="Marquer ${k}">&#128205;</button>
      <button class="cl" data-c="${k}" title="Effacer ${k}">&#10006;</button>
    </div>`).join('');
}
buildRows();

function renderJournal(){
  const list = $('journal-list');
  if(!history || history.length === 0){
    list.innerHTML = '<div style="text-align:center;padding:20px;opacity:.5">Aucun point enregistré</div>';
    return;
  }

  list.innerHTML = history.map(item => `
    <div class="log-item">
      <div class="log-top">
        <span style="color:${COL[item.k]}">Point ${item.k}</span>
        <span style="opacity:.7;font-weight:normal">${item.date}</span>
      </div>
      <div class="log-coords">
        Lat : ${item.lat.toFixed(6)}° | Lon : ${item.lon.toFixed(6)}°
      </div>
    </div>
  `).join('');
}

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.style.display='none',3000);
}

$('pts').addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!t) return;

  if(t.dataset.k){
    sel=t.dataset.k;
  } else if(t.dataset.m){
    const k=t.dataset.m;
    if(!started || !gpsEnabled || !me){
      showToast('Active le GPS pour marquer la position.');
      return;
    }

    const now = new Date();
    const dateStr = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR');
    
    // Enregistrement actif + Historique
    P[k] = { lat: me.lat, lon: me.lon, date: dateStr };
    sel = k;

    history.unshift({
      k: k,
      lat: me.lat,
      lon: me.lon,
      date: dateStr
    });

    save();
    ping(.5, FQ[k]);
    showToast('Point '+k+' enregistré.');
  } else if(t.dataset.c){
    P[t.dataset.c] = null;
    save();
  }
  refresh();
});

function refresh(){
  const S=calc();

  document.querySelectorAll('.lab').forEach(b=>{
    const k=b.dataset.k;
    const it=S.items.find(i=>i.k===k);
    b.textContent=(sel===k?'\u25b6 ':'')+k+' \u2014 '+
      (P[k] ? (it ? fmt(it.d)+' \u00b7 '+words(it,S.H.h!=null) : 'enregistr\u00e9') : 'vide');
    b.style.background=sel===k?'#0a3a1c':'#04210f';
  });

  const it=S.items.find(i=>i.k===sel);

  if(it){
    $('big').textContent=sel+' \u00b7 '+fmt(it.d);
    $('big').style.color=COL[sel];$('sub').textContent=it.d<12?' Tu es arriv\u00e9 !':words(it,S.H.h!=null);
  } else {
    $('big').textContent='\u2014';$('big').style.color='';
    if(!started) $('sub').innerHTML='Active le GPS puis marque un point avec &#128205;';
    else if(!gpsEnabled) $('sub').textContent='GPS d\u00e9sactiv\u00e9';
    else if(!me) $('sub').textContent='Recherche de ta position GPS\u2026';
    else $('sub').innerHTML='Appuie sur &#128205; pour marquer '+sel;
  }

  const H=S.H;
  let cap='pas de boussole';
  if(H.h!=null) cap='cap : '+H.src+' '+Math.round(H.h)+'\u00b0';

  let gps='GPS d\u00e9sactiv\u00e9';
  if(gpsEnabled) gps=me?'GPS \u00b1'+Math.round(me.acc)+' m':'GPS recherche\u2026';

  $('st').textContent=started ? cap+' \u00b7 '+gps : '';

  setGpsButton();
}

setInterval(refresh,400);

$('gps').onclick=toggleGPS;
$('snd').onclick=()=>{ soundOn=!soundOn; $('snd').innerHTML='&#128066; Sonar : '+(soundOn?'on':'off'); audio(); };
$('slp').onclick=()=>{ audio();$('sleep').style.display='flex'; };
$('sleep').onclick=()=>{$('sleep').style.display='none'};

$('clear').onclick=()=>{
  if(!confirm('Effacer les repères actifs A, B et C ?')) return;
  P={A:null,B:null,C:null};
  save();
  refresh();
};

/* Gestion du Journal */
$('open-journal').onclick=()=>{
  renderJournal();
  $('journal-panel').style.display='flex';
};
$('close-journal').onclick=()=>{$('journal-panel').style.display='none';
};
$('clear-hist').onclick=()=>{
  if(!confirm('Effacer définitivement tout l\'historique du journal ?')) return;
  history=[];
  save();
  renderJournal();
};

$('go').onclick=async()=>{
  if(started) return;
  started=true;
  $('ov').style.display='none';
  audio();
  await startOrientation();
  swStart=performance.now();
  startGPS();
  refresh();
};

/* ---------- Dessin Radar ---------- */
function draw(){
  const C=350,R=320;
  g.clearRect(0,0,700,700);

  const S=calc();
  const sw=((performance.now()-swStart)/3500)%1;
  const sweepDeg=sw*360;

  g.fillStyle='#03150a';
  g.strokeStyle='#1f8a4c';
  g.lineWidth=2;
  g.beginPath();g.arc(C,C,R,0,Math.PI*2);g.fill();g.stroke();

  g.globalAlpha=.4;
  for(let i=1;i<4;i++){
    g.beginPath();g.arc(C,C,R*i/4,0,Math.PI*2);g.stroke();
  }
  g.beginPath();
  g.moveTo(C,C-R);g.lineTo(C,C+R);
  g.moveTo(C-R,C);g.lineTo(C+R,C);
  g.stroke();
  g.globalAlpha=1;

  [['N','#ff6a5d'],['E','#6a8a78'],['S','#6a8a78'],['O','#6a8a78']]
  .forEach(([l,c],i)=>{
    const a=rad(i*90-S.hh);
    g.fillStyle=c;
    g.font='bold 26px monospace';
    g.textAlign='center';
    g.fillText(l,C+Math.sin(a)*(R-22),C-Math.cos(a)*(R-22)+9);
  });

  const sa=rad(sweepDeg)-Math.PI/2;
  g.strokeStyle='#5dff9a';
  g.lineWidth=3;
  g.beginPath();g.moveTo(C,C);
  g.lineTo(C+Math.cos(sa)*R,C+Math.sin(sa)*R);
  g.stroke();

  for(const it of S.items){
    const ang=rad(it.rel);
    const r=R*Math.sqrt(Math.min(it.d/S.rng,1));
    const x=C+Math.sin(ang)*r;
    const y=C-Math.cos(ang)*r;
    const col=COL[it.k];

    g.fillStyle=col;
    g.beginPath();g.arc(x,y,it.k===sel?14:11,0,Math.PI*2);g.fill();

    g.font='bold 26px monospace';
    g.textAlign='center';
    g.fillText(it.k,x,y-24);
  }

  g.fillStyle='#5dff9a';
  g.beginPath();
  g.moveTo(C,C-16);g.lineTo(C+10,C+10);g.lineTo(C,C+4);g.lineTo(C-10,C+10);
  g.fill();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
